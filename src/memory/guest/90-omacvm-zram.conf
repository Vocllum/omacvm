# OmacVM: Omarchy's default is zram-size = ram (as much swap as the VM has
# memory). Pages swapped into zram stay resident in the guest and cannot be handed
# back to macOS (Parallels' balloon has no free-page reporting), so a large
# zram only doubles what the VM appears to hold. 8 GB is plenty for bursts.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = zstd
