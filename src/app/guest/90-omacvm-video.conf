# OmacVM.app: video decoding on the Mac's media engine (VA-API through the
# app's virtio-gpu). omacvm_drv_video.so is Mesa's virtio_gpu driver with only
# NV12 surfaces offered, so Firefox can show them (see omacvm_drv_video.c).
LIBVA_DRIVER_NAME=omacvm
LIBVA_DRIVERS_PATH=/usr/local/lib/dri:/usr/lib/dri
