# Quick checks on every pull request and on main: syntax, ShellCheck errors,
# the app's and the Mac helpers' builds, Omanotch's offline tests and the
# control centre's tests. No signing beyond ad hoc, no VMs.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: List shell scripts
        run: |
          # The same list CONTRIBUTING.md's quick checks use.
          .github/shell-files.sh > "$RUNNER_TEMP/shell-files"
          wc -l < "$RUNNER_TEMP/shell-files"

      - name: bash -n (macOS's bash 3.2, which the Mac side runs on)
        run: |
          fail=0
          while read -r f; do /bin/bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }; done < "$RUNNER_TEMP/shell-files"
          exit $fail

      - name: ShellCheck (errors only)
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          tr '\n' '\0' < "$RUNNER_TEMP/shell-files" | xargs -0 shellcheck -S error -s bash

      - name: Python compiles
        run: |
          git ls-files -z '*.py' | xargs -0 python3 -m py_compile
          python3 -m py_compile src/control/omacvm

      - name: omacvm report runs on macOS's own python3
        run: /usr/bin/python3 -c "import sys; sys.path.insert(0, 'src/control'); import omacvm_cc.report, omacvm_cc.collect, omacvm_cc.bridge, omacvm_cc.state"

      - name: Control centre tests (state, redaction, Textual Pilot against a fake Mac)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "textual==8.2.8" pytest
          cd src/control && "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests

      - name: Bridge's control centre requests (allow-list, limits, manifest signatures)
        run: src/bridge/mac/tests/run.sh

      - name: Update parts cover src/
        run: python3 src/release/manifest.py parts > /dev/null

      - name: OmacVM.app builds
        working-directory: app/app
        run: swift build

      - name: Mac helpers build (Gestures, Bridge)
        run: |
          src/gestures/mac/build.sh
          src/bridge/mac/build.sh

      - name: Omanotch offline tests
        run: src/omanotch/mac/test.sh

      - name: Which VM --vm NAME means
        run: src/tests/vm-names.sh

      - name: A Mac helper that does not build
        run: src/tests/mac-install.sh
