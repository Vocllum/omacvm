<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="t d">
<title id="t">Lock screen follows the theme</title>
<desc id="d">Animated diagram. Left: Omarchy in the VM. Its theme menu switches the theme from Rose Pine to Tokyo Night, then to Everforest, then back to Rose Pine; the wallpaper, bar and window borders change each time. Right: the Mac's lock screen. Each theme switch travels to the Mac through a Parallels shared folder, and the Mac's wallpaper and lock screen change to match: the theme's background, blurred, with Omarchy's password field and its "Enter Password" placeholder in the theme's colours.</desc>

