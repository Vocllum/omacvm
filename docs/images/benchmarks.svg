<text x="500.0" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#908caa">MacBook Pro M4 Max · macOS 15.7 · 16 CPUs, 48 GB per VM · Chrome 154 · macOS itself = 100 %</text>
