<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 976" width="1000" height="976" role="img" aria-labelledby="t d">
<title id="t">How fast Omarchy runs on each route, compared with macOS itself</title>
<desc id="d">CPU, one core (Geekbench 7): Parallels: 97 percent, UTM: 90 percent, VMware Fusion: 93 percent, OmacVM.app: 97 percent. CPU, all cores (Geekbench 7): Parallels: 96 percent, UTM: 89 percent, VMware Fusion: 99 percent, OmacVM.app: 99 percent. Web apps (Speedometer 3.1): Parallels: 67 percent, UTM: 52 percent, VMware Fusion: 71 percent, OmacVM.app: 70 percent. Graphics in the browser (MotionMark 1.3.1): Parallels: no stable result (frame timing), UTM: no stable result (frame timing), VMware Fusion: 40 percent, OmacVM.app: no stable result (frame timing). GPU in the browser (Basemark Web 3.0): Parallels: 75 percent, UTM: 67 percent, VMware Fusion: 78 percent, OmacVM.app: not measured yet (it hung before 2.6.0, finding 23). 3D in the browser (WebGL Aquarium, 30,000 fish): Parallels: 25 percent, UTM: 26 percent, VMware Fusion: 38 percent, OmacVM.app: 22 percent.</desc>
<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern></defs>
