<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">Displays follow the Mac</title>
<desc id="d">Animated diagram. Left: the macOS System Settings Displays arrangement with the MacBook's built-in Retina display and an external display to its right. Right: the Omarchy VM's monitors in Hyprland, Virtual-1 (the built-in Retina display at 120 Hz) and Virtual-2, in the same arrangement. A pointer drags the external display in macOS from the right side to above and to the left of the built-in display; the change travels to the VM and Virtual-2 moves to exactly the same place. Later it is dragged back and the VM follows again. Each monitor keeps its own Omarchy bar and its own workspaces. Labels underneath: native Retina resolution, 120 Hz ProMotion, every external display, Omarchy's scaling choice kept.</desc>

<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern></defs><rect width="1000" height="500" fill="#191724"/><rect width="1000" height="500" fill="url(#dots)"/>
