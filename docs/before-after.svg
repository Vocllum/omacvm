<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9d0"/><stop offset="0.5" stop-color="#d9c6e6"/><stop offset="1" stop-color="#b8d3dd"/>
    </linearGradient>
    <g id="minibar">
      <rect x="0" y="0" width="400" height="12" fill="#faf4ed"/>
      <rect x="5" y="3.5" width="5" height="5" rx="1" fill="none" stroke="#575279" stroke-width="1"/>
      <circle cx="16" cy="6" r="2.2" fill="#575279"/><circle cx="23" cy="6" r="1.4" fill="#9893a5"/><circle cx="29" cy="6" r="1.4" fill="#9893a5"/>
      <rect x="352" y="3.5" width="4" height="5" rx="1" fill="#575279"/><rect x="361" y="3.5" width="5" height="5" rx="1" fill="#575279"/>
      <path d="M372,4 l2.5,0 l2.5,-1.6 l0,7 l-2.5,-1.6 l-2.5,0 z" fill="#575279"/>
      <rect x="384" y="3" width="3" height="6" rx="0.7" fill="#575279"/>
    </g>
  </defs>
  <rect width="1000" height="400" rx="18" fill="#12141b"/>

  <!-- before -->
  <text x="250" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e9f0">Parallels full screen</text>
  <g transform="translate(-24 0)">
  <rect x="40" y="52" width="420" height="270" rx="16" fill="#1c1e26" stroke="#3b3f4d" stroke-width="2"/>
  <rect x="50" y="62" width="400" height="250" rx="8" fill="url(#wall2)"/>
  <rect x="50" y="62" width="400" height="18" fill="#000"/>
  <g transform="translate(50 80)"><use href="#minibar"/><text x="175" y="9" font-size="6.5" fill="#575279">Wednesday 18:55</text></g>
  <rect x="215" y="62" width="70" height="15" rx="6" fill="#000"/>
  <rect x="56" y="98" width="190" height="208" rx="5" fill="#232136"/>
  <rect x="254" y="98" width="190" height="208" rx="5" fill="#fffaf3"/>
  <!-- dimension marks -->
  <path d="M466,62 L474,62 M470,62 L470,92 M466,92 L474,92" stroke="#ff7a59" stroke-width="2"/>
  <text x="478" y="73" font-size="10.5" fill="#ff7a59">43 pt black</text>
  <text x="478" y="87" font-size="10.5" fill="#ff7a59">+ 26 pt bar</text>
  </g>
  <text x="250" y="346" text-anchor="middle" font-size="13" fill="#c6c9d6">The notch strip stays black, and the bar</text>
  <text x="250" y="364" text-anchor="middle" font-size="13" fill="#c6c9d6">takes another row of your screen.</text>

  <!-- after -->
  <text x="750" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e9f0">+ omarchy-notch-bar</text>
  <rect x="540" y="52" width="420" height="270" rx="16" fill="#1c1e26" stroke="#3b3f4d" stroke-width="2"/>
  <rect x="550" y="62" width="400" height="250" rx="8" fill="url(#wall2)"/>
  <rect x="550" y="62" width="400" height="18" fill="#faf4ed"/>
  <g transform="translate(550 65)"><use href="#minibar"/><text x="243" y="9" font-size="6.5" fill="#575279">Wednesday 18:55</text></g>
  <rect x="715" y="62" width="70" height="15" rx="6" fill="#000"/>
  <rect x="556" y="86" width="190" height="220" rx="5" fill="#232136"/>
  <rect x="754" y="86" width="190" height="220" rx="5" fill="#fffaf3"/>
  <path d="M970,86 L978,86 M974,86 L974,306 M970,306 L978,306" stroke="#5fd4c4" stroke-width="2"/>
  <text x="750" y="346" text-anchor="middle" font-size="13" fill="#c6c9d6">The real Omarchy bar lives beside the notch,</text>
  <text x="750" y="364" text-anchor="middle" font-size="13" fill="#c6c9d6">and your windows get the whole screen below it.</text>
</svg>
