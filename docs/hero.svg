<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    omarchy-notch-bar — how it works (animated, 10 s loop)
    0.0-2.0 s  the notch strip is black (Parallels leaves it unused)
    1.5-4.0 s  the bar is rendered on an invisible monitor and streamed over
    3.6 s      the bar appears in the strip
    5.0-6.4 s  a click travels back into the VM, a panel opens under the strip
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15171f"/>
      <stop offset="1" stop-color="#0d0e13"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9d0"/>
      <stop offset="0.5" stop-color="#d9c6e6"/>
      <stop offset="1" stop-color="#b8d3dd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6273"/>
    </marker>
    <!-- the Omarchy bar, drawn once and reused -->
    <g id="bar">
      <rect x="0" y="0" width="536" height="14" fill="#faf4ed"/>
      <rect x="6" y="4" width="6" height="6" rx="1" fill="none" stroke="#575279" stroke-width="1.2"/>
      <circle cx="20" cy="7" r="2.6" fill="#575279"/>
      <circle cx="28" cy="7" r="1.6" fill="#9893a5"/>
      <circle cx="35" cy="7" r="1.6" fill="#9893a5"/>
      <circle cx="42" cy="7" r="1.6" fill="#9893a5"/>
      <text x="318" y="10.2" font-size="7.5" fill="#575279">Wednesday 18:55</text>
      <text x="388" y="10.4" font-size="8" fill="#575279">☁</text>
      <rect x="484" y="4.5" width="5" height="5" rx="1" fill="#575279"/>
      <rect x="494" y="4.5" width="6" height="5" rx="1" fill="#575279"/>
      <path d="M506,5 l3,0 l3,-2 l0,8 l-3,-2 l-3,0 z" fill="#575279"/>
      <rect x="518" y="4" width="7" height="6" rx="1" fill="none" stroke="#575279" stroke-width="1.2"/>
      <rect x="529" y="3.5" width="3.5" height="7" rx="0.8" fill="#575279"/>
    </g>
  </defs>

  <rect width="1000" height="560" rx="18" fill="url(#bg)"/>

  <!-- ============ MacBook ============ -->
  <text x="340" y="30" text-anchor="middle" font-size="14" fill="#9aa0b4" letter-spacing="1.5">YOUR MACBOOK</text>
  <rect x="60" y="42" width="560" height="360" rx="20" fill="#1c1e26" stroke="#3b3f4d" stroke-width="2"/>
  <rect x="72" y="54" width="536" height="336" rx="10" fill="url(#wall)"/>
  <!-- VM windows below the strip -->
  <rect x="80" y="78" width="258" height="304" rx="6" fill="#232136"/>
  <text x="92" y="100" font-size="10" fill="#9ccfd8" font-family="Menlo, monospace">~ $ fastfetch</text>
  <text x="92" y="116" font-size="10" fill="#e0def4" font-family="Menlo, monospace">OS: Omarchy (Arch ARM)</text>
  <text x="92" y="132" font-size="10" fill="#e0def4" font-family="Menlo, monospace">WM: Hyprland</text>
  <text x="92" y="148" font-size="10" fill="#e0def4" font-family="Menlo, monospace">Host: Parallels VM</text>
  <rect x="346" y="78" width="254" height="304" rx="6" fill="#fffaf3"/>
  <rect x="356" y="90" width="234" height="12" rx="6" fill="#f2e9e1"/>
  <rect x="356" y="116" width="160" height="7" rx="3" fill="#dfdad9"/>
  <rect x="356" y="130" width="200" height="7" rx="3" fill="#dfdad9"/>
  <rect x="356" y="144" width="120" height="7" rx="3" fill="#dfdad9"/>

  <!-- the notch strip: black at first, then the mirrored bar -->
  <rect x="72" y="54" width="536" height="22" fill="#000"/>
  <g transform="translate(72 58)" opacity="0">
    <rect x="0" y="-4" width="536" height="22" fill="#faf4ed"/>
    <use href="#bar"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             values="0;0;1;1;0" keyTimes="0;0.36;0.40;0.97;1"/>
  </g>
  <!-- camera housing -->
  <rect x="300" y="54" width="80" height="20" rx="7" fill="#000"/>
  <circle cx="352" cy="63" r="2.5" fill="#1f2a3a"/>

  <!-- phase 1 label: the black strip -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.36;1"/>
    <path d="M460,106 C470,95 478,86 486,80" stroke="#ff7a59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="392" y="104" width="206" height="38" rx="8" fill="#ff7a59"/>
    <text x="495" y="120" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b0d08">Parallels full screen stops here.</text>
    <text x="495" y="134" text-anchor="middle" font-size="11" fill="#1b0d08">43 pt of black next to the notch</text>
  </g>

  <!-- phase 3: pointer clicks the clock in the strip, a panel opens below -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.48;0.50;0.90;0.93;1"/>
    <path d="M0,0 L0,15 L4,11 L7,18 L10,17 L7,10 L12,10 z" fill="#000" stroke="#fff" stroke-width="1.2">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.56;1"
                     calcMode="linear" path="M430,220 L398,66"/>
    </path>
    <circle cx="398" cy="66" r="3" fill="none" stroke="#ff7a59" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="10s" repeatCount="indefinite" values="3;3;16;16" keyTimes="0;0.57;0.62;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.569;0.57;0.62;1"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.95;0.98;1"/>
    <rect x="316" y="82" width="170" height="104" rx="8" fill="#faf4ed" stroke="#56949f" stroke-width="2"/>
    <text x="330" y="112" font-size="20" font-weight="700" fill="#575279">September 30</text>
    <text x="330" y="134" font-size="11" fill="#797593">Wednesday · week 40</text>
    <text x="330" y="168" font-size="10" fill="#9893a5">opened by Omarchy itself</text>
  </g>

  <!-- ============ Inside the VM ============ -->
  <text x="662" y="30" font-size="14" fill="#9aa0b4" letter-spacing="1.5">INSIDE THE VM</text>
  <rect x="660" y="42" width="300" height="122" rx="14" fill="#1a1c24" stroke="#3b3f4d"/>
  <text x="676" y="66" font-size="12.5" font-weight="600" fill="#e8e9f0">Omarchy · Hyprland</text>
  <rect x="676" y="80" width="268" height="40" rx="6" fill="none" stroke="#8b92ff" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g transform="translate(676 90) scale(0.5)">
    <use href="#bar"/>
  </g>
  <text x="810" y="112" text-anchor="middle" font-size="9.5" fill="#8b92ff">NOTCH · 2056 × 26 · invisible</text>
  <text x="676" y="140" font-size="11" fill="#9aa0b4">an invisible extra monitor, "NOTCH",</text>
  <text x="676" y="155" font-size="11" fill="#9aa0b4">renders the real bar — nobody sees it</text>

  <!-- ============ notchcast ============ -->
  <rect x="660" y="206" width="300" height="84" rx="14" fill="#1a1c24" stroke="#3b3f4d"/>
  <text x="676" y="230" font-size="12.5" font-weight="600" fill="#e8e9f0">notchcast</text>
  <text x="676" y="250" font-size="11" fill="#9aa0b4">captures only when Hyprland repaints,</text>
  <text x="676" y="265" font-size="11" fill="#9aa0b4">sends just the changed pixels (LZ4,</text>
  <text x="676" y="280" font-size="11" fill="#9aa0b4">~2 KB) over the Parallels network</text>

  <!-- ============ macOS helper ============ -->
  <text x="662" y="330" font-size="14" fill="#9aa0b4" letter-spacing="1.5">ON THE MAC</text>
  <rect x="660" y="342" width="300" height="84" rx="14" fill="#1a1c24" stroke="#3b3f4d"/>
  <text x="676" y="366" font-size="12.5" font-weight="600" fill="#e8e9f0">Omarchy Notch Bar.app</text>
  <text x="676" y="386" font-size="11" fill="#9aa0b4">a panel above the menu bar that never</text>
  <text x="676" y="401" font-size="11" fill="#9aa0b4">takes focus: draws the frames, sends</text>
  <text x="676" y="416" font-size="11" fill="#9aa0b4">your clicks and scrolling back</text>

  <!-- pipes -->
  <path id="down1" d="M790,164 L790,206" stroke="#5d6273" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path id="down2" d="M790,290 L790,342" stroke="#5d6273" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path id="left" d="M660,384 L642,384 Q634,384 634,376 L634,74 Q634,66 626,66 L612,66" stroke="#5d6273" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path id="up1" d="M900,342 L900,290" stroke="#3a3f52" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path id="up2" d="M900,206 L900,164" stroke="#3a3f52" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- frames flowing to the Mac (orange) -->
  <g fill="#ff9a5a">
    <rect x="-7" y="-5" width="14" height="10" rx="2.5">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.15;0.21;1" calcMode="linear" path="M790,164 L790,206"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.149;0.15;0.21;0.211;1"/>
    </rect>
    <rect x="-7" y="-5" width="14" height="10" rx="2.5">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.21;0.27;1" calcMode="linear" path="M790,290 L790,342"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.209;0.21;0.27;0.271;1"/>
    </rect>
    <rect x="-7" y="-5" width="14" height="10" rx="2.5">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.27;0.37;1" calcMode="linear" path="M660,384 L642,384 Q634,384 634,376 L634,74 Q634,66 626,66 L612,66"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.269;0.27;0.37;0.371;1"/>
    </rect>
  </g>

  <!-- the click flowing back into the VM (teal) -->
  <g fill="#5fd4c4">
    <circle r="6">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.575;0.61;1" calcMode="linear" path="M900,342 L900,290"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.574;0.575;0.61;0.611;1"/>
    </circle>
    <circle r="6">
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.61;0.645;1" calcMode="linear" path="M900,206 L900,164"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.609;0.61;0.645;0.646;1"/>
    </circle>
  </g>
  <text x="912" y="320" font-size="10.5" fill="#5fd4c4">click</text>
  <text x="757" y="190" font-size="10.5" fill="#ff9a5a" text-anchor="end">pixels</text>

  <!-- ============ legend ============ -->
  <g font-size="12.5" fill="#c6c9d6">
    <circle cx="74" cy="452" r="11" fill="#ff7a59"/><text x="74" y="456.5" text-anchor="middle" fill="#1b0d08" font-weight="700">1</text>
    <text x="94" y="457">Parallels keeps its full-screen VM below the camera: a black strip.</text>
    <circle cx="74" cy="480" r="11" fill="#8b92ff"/><text x="74" y="484.5" text-anchor="middle" fill="#0d0e2a" font-weight="700">2</text>
    <text x="94" y="485">Inside the VM, Omarchy draws its bar on an invisible monitor the size of that strip.</text>
    <circle cx="74" cy="508" r="11" fill="#ff9a5a"/><text x="74" y="512.5" text-anchor="middle" fill="#1b0d08" font-weight="700">3</text>
    <text x="94" y="513">Only the changed pixels are streamed to a tiny Mac app that paints them over the strip.</text>
    <circle cx="74" cy="536" r="11" fill="#5fd4c4"/><text x="74" y="540.5" text-anchor="middle" fill="#05201c" font-weight="700">4</text>
    <text x="94" y="541">Your clicks travel back, and Omarchy opens its panels right below the notch.</text>
  </g>
</svg>
